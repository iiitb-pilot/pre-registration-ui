name: Pre-registration-ui manual build upon a push

on:
  workflow_dispatch

  push:
    branches:
      - '!master'
      - dst-dev-*
      - mec-*

jobs:
  build-pre-registration-ui:
    uses: iiitb-pilot/kattu/.github/workflows/npm-build.yml@develop
    with:
      SERVICE_LOCATION: pre-registration-ui
      BUILD_ARTIFACT: pre-registration-ui
    secrets:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}

  build-docker-pre-registration-ui:
    needs: build-pre-registration-ui
    strategy:
      matrix:
        include:
          - SERVICE_LOCATION: 'pre-registration-ui'
            SERVICE_NAME: 'pre-registration-ui'
            NPM_BUILD: true
            BUILD_ARTIFACT: 'pre-registration-ui'
      fail-fast: false
    name: ${{ matrix.SERVICE_NAME }}
    uses: iiitb-pilot/kattu/.github/workflows/docker-build.yml@master
    with:
      SERVICE_LOCATION: ${{ matrix.SERVICE_LOCATION }}
      SERVICE_NAME: ${{ matrix.SERVICE_NAME }}
      NPM_BUILD: ${{ matrix.NPM_BUILD }}
      BUILD_ARTIFACT: ${{ matrix.BUILD_ARTIFACT }}
    secrets:
      DEV_NAMESPACE_DOCKER_HUB: ${{ secrets.DEV_NAMESPACE_DOCKER_HUB }}
      ACTOR_DOCKER_HUB: ${{ secrets.ACTOR_DOCKER_HUB }}
      RELEASE_DOCKER_HUB: ${{ secrets.RELEASE_DOCKER_HUB }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}
